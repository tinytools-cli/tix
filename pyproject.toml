[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telefleet"
version = "0.3.0"
description = "Telefleet -- a minimal, agent-native ticket tracker. Agents. Sessions. Tickets. Connected. CLI-first, SQLite-backed, with an optional web UI. (Formerly published as 'tix' -- the tix/tix-web commands still work.)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.0",
    "fastapi>=0.100",
    "uvicorn>=0.30",
    "pydantic>=2.0",
]

[project.scripts]
telefleet = "telefleet.cli:cli"
telefleet-web = "telefleet.web:main"
tix = "telefleet.cli:cli"
tix-web = "telefleet.web:main"

[tool.setuptools]
packages = ["telefleet"]
include-package-data = true

[tool.setuptools.package-data]
telefleet = ["static/*"]
