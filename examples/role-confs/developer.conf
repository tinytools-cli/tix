# Example role-conf for an agent whose work is code/infra: editing files, committing,
# running services. One regex per line, matched against the transcript window; '#'
# starts a comment. This is close to `tix guard check`'s own built-in defaults —
# useful as a starting point to add your own patterns to, not just as-is.
#
# Install: tix guard check --conf /path/to/this/file ...
# or, for the Claude Code adapter: export TIX_GUARD_CONF=/path/to/this/file

\bgit\s+(commit|push|merge|reset|checkout)\b
\bsystemctl\s+(?!.*(status|is-active|list|show|cat))
\bdocker\s+(run|rm|stop|start|restart|exec|build|compose)\b
\bapt(-get)?\s+(install|remove|purge)\b
\b(rm|mv|chmod|chown|tee|crontab)\s
\bnpm\s+(publish|deploy)\b
