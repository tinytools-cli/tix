# Example role-conf for an agent whose work doesn't touch a filesystem at all —
# sending email, managing a calendar, driving a browser. This is the case the
# generic file-and-shell-command defaults miss entirely: a role-conf like this
# is how you make enforcement mean something for that kind of agent instead of
# enforcing nothing.
#
# These patterns are illustrative, not universal — they need to actually match
# the text your own transcript records for these actions (a tool name, an MCP
# call, a shell command, whatever your setup produces). Read a real transcript
# window and adjust the patterns to match what's actually in it.
#
# Install: tix guard check --conf /path/to/this/file ...
# or, for the Claude Code adapter: export TIX_GUARD_CONF=/path/to/this/file

send.*email
reply.*email
calendar.*(create|update|delete)
post.*message
click|type_text|navigate_to
